services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: skroutz_scraper
      POSTGRES_USER: skroutz_user
      POSTGRES_PASSWORD: skroutz_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-keycloak-schema.sql:/docker-entrypoint-initdb.d/init-keycloak-schema.sql
    restart: unless-stopped
    networks:
      - elastic
    healthcheck:
      # Fixed the user here from crypto_user to skroutz_user to match your env
      test: [ "CMD-SHELL", "pg_isready -U skroutz_user -d skroutz_scraper" ]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - CSP_STRICT=false
      - SERVER_PUBLICBASEURL=http://localhost:5601
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    networks:
      - elastic

  ollama:
    image: ollama/ollama:0.23.0
    container_name: ollama
    ports: [ "11434:11434" ]
    volumes:
      - ../model_files:/model_files
    pull_policy: always
    tty: true
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "/model_files/run_ollama.sh" ]
    networks:
      - elastic
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/skroutz_scraper?currentSchema=keycloak&rewriteBatchedStatements=true
      KC_DB_USERNAME: skroutz_user
      KC_DB_PASSWORD: skroutz_password
    ports:
      - "8081:8080"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elastic
    restart: unless-stopped

  skroutz-web-scraper:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: skroutz-web-scraper
    ports:
      - "8082:8082"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/skroutz_scraper
      - DB_USERNAME=skroutz_user
      - DB_PASSWORD=skroutz_password
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=qwen2.5:3b
      - LLM_LOG_RESPONSES=false
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/skroutz-scraper
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - elastic
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  elastic: