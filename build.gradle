import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        // Docker Compose testing
        classpath 'com.bmuschko:gradle-docker-plugin:9.4.0'
        classpath 'com.avast.gradle:gradle-docker-compose-plugin:0.17.12'
    }
}

plugins {
    id 'java'
    id 'groovy'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.skroutz.scraper'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    functionalTest {
        groovy {
            srcDirs "src/functionalTest/groovy"
        }
        java {
            srcDirs "src/functionalTest/java"
        }
        resources {
            srcDirs "src/functionalTest/resources"
        }
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }

    functionalTestImplementation.extendsFrom(testImplementation)
    functionalTestRuntimeOnly.extendsFrom(testRuntimeOnly)
}

repositories {
    mavenCentral()
}

dependencies {

    // spring boot
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // flyway
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // openapi
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    // selenium
    implementation 'org.seleniumhq.selenium:selenium-java:4.39.0'
    implementation 'io.github.bonigarcia:webdrivermanager:6.3.3'

    // jsoup
    implementation 'org.jsoup:jsoup:1.22.1'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // mapstruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // postgresql
    runtimeOnly 'org.postgresql:postgresql'

    //text utils
    implementation 'org.apache.commons:commons-text:1.15.0'

    // testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.apache.groovy:groovy:5.0.3'
    testImplementation "org.spockframework:spock-core:2.4-M7-groovy-5.0"
    testImplementation "org.spockframework:spock-spring:2.4-M7-groovy-5.0"
    testImplementation 'org.apache.groovy:groovy-json:5.0.3'
    testImplementation("com.github.javafaker:javafaker:1.0.2") {
        exclude group: 'org.yaml', module: 'snakeyaml'
    }
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

}

apply plugin: 'docker-compose'
apply plugin: com.bmuschko.gradle.docker.DockerRemoteApiPlugin

def dockerComposeFilePath = "${rootProject.projectDir}/docker-compose-functional-tests.yml"

dockerCompose {
    if (DefaultNativePlatform.currentOperatingSystem.macOsX) {
        executable = '/usr/local/bin/docker-compose'
        dockerExecutable = '/usr/local/bin/docker'
    }

    useComposeFiles = [dockerComposeFilePath]

    // Wait for database services to be ready
    waitForTcpPorts = true

    // Remove volumes after stopping (clean state for each test run)
    removeVolumes = true

    // Force recreation of containers to ensure clean state
    forceRecreate = true
}

def coloredStatus = { def resultType ->
    String ansiReset = "\u001B[0m"
    String ansiGreen = "\u001B[32m"
    String ansiRed = "\u001B[31m"
    String ansiYellow = "\u001B[33m"
    def status
    switch (resultType) {
        case TestResult.ResultType.SUCCESS:
            status = "$ansiGreen $resultType $ansiReset"
            break
        case TestResult.ResultType.FAILURE:
            status = "$ansiRed $resultType $ansiRed"
            break
        default:
            // TestResult.ResultType.SKIPPED
            status = "$ansiYellow $resultType $ansiReset"
            break
    }
    return status
}

ext.testClassResults = [:]

tasks.withType(Test).configureEach { Test testTask ->
    def taskName = testTask.name

    useJUnitPlatform()
    // Failfast on first failure by using -PfailFast='true'
    failFast = project.hasProperty('failFast') && project.property('failFast') == 'true'

    testLogging {
        events "failed", "skipped"
        exceptionFormat "short"
        showStackTraces false
        showCauses true
        showExceptions true

        beforeSuite { desc ->
            if (!desc.parent) {
                // Reset class results tracking and print header
                testClassResults[taskName] = [:]
            }
        }

        afterSuite { desc, result ->
            if (!desc.parent) {
                // Root suite - print accumulated class results then overall summary
                def classResults = testClassResults[taskName]
                String ansiCyan = "\u001B[36m"
                String ansiReset = "\u001B[0m"
                String ansiBold = "\u001B[1m"
                String ansiGreen = "\u001B[32m"
                String ansiRed = "\u001B[31m"
                String ansiDim = "\u001B[2m"

                logger.quiet ""
                logger.quiet "  $ansiCyan╭────────────────────────────────────────────────────┬──────────┬──────────┬──────────╮$ansiReset"
                logger.quiet "  $ansiCyan│$ansiReset ${'Test Class'.padRight(50)} $ansiCyan│$ansiReset ${'Passed'.padLeft(8)} $ansiCyan│$ansiReset ${'Failed'.padLeft(8)} $ansiCyan│$ansiReset ${'Time'.padLeft(8)} $ansiCyan│$ansiReset"
                logger.quiet "  $ansiCyan├────────────────────────────────────────────────────┼──────────┼──────────┼──────────┤$ansiReset"

                if (classResults) {
                    // Get unique classes and sort them
                    def sortedClasses = classResults.keySet().sort()

                    sortedClasses.each { fullClassName ->
                        def data = classResults[fullClassName]
                        String className = fullClassName.split('\\.')[-1]

                        // Format values first, then apply colors
                        def passedVal = data.passed
                        def failedVal = data.failed
                        def timeVal = String.format('%,d', data.duration)

                        // Apply padding to plain text
                        String classCol = className.padRight(50)
                        String passedCol = passedVal.toString().padLeft(8)
                        String failedCol = failedVal.toString().padLeft(8)
                        String timeCol = (timeVal + "ms").padLeft(8)

                        // Apply colors after padding
                        if (data.resultType == TestResult.ResultType.FAILURE) {
                            passedCol = ansiRed + passedCol + ansiReset
                            failedCol = ansiRed + failedCol + ansiReset
                        } else if (passedVal > 0) {
                            passedCol = ansiGreen + passedCol + ansiReset
                        }

                        if (failedVal > 0) {
                            failedCol = ansiRed + failedCol + ansiReset
                        } else {
                            failedCol = ansiDim + failedCol + ansiReset
                        }

                        logger.quiet "  $ansiCyan│$ansiReset ${classCol} $ansiCyan│$ansiReset ${passedCol} $ansiCyan│$ansiReset ${failedCol} $ansiCyan│$ansiReset ${timeCol} $ansiCyan│$ansiReset"
                    }
                }

                // Print overall summary
                if (result.testCount > 0) {
                    def totalDuration = result.endTime - result.startTime
                    def successRate = result.testCount > 0 ? (result.successfulTestCount / result.testCount * 100) : 0
                    String summaryColor = result.failedTestCount > 0 ? ansiRed : ansiGreen

                    logger.quiet "  $ansiCyan╰────────────────────────────────────────────────────┴──────────┴──────────┴──────────╯$ansiReset"
                    logger.quiet ""
                    logger.quiet "  ${summaryColor}${ansiBold}Tests:$ansiReset ${result.testCount}  │  ${summaryColor}Passed:$ansiReset ${result.successfulTestCount}  │  ${result.failedTestCount > 0 ? ansiRed : ''}Failed:$ansiReset ${result.failedTestCount}  │  Skipped: ${result.skippedTestCount}  │  Time: ${String.format('%,d', totalDuration)}ms  │  ${summaryColor}Success:$ansiReset ${String.format('%.1f', successRate)}%"
                    logger.quiet ""
                }
                return
            }

            // Track and accumulate results by class
            if (desc.className) {
                String className = desc.className
                def classResults = testClassResults[taskName]

                if (!classResults.containsKey(className)) {
                    classResults[className] = [
                        passed: 0,
                        failed: 0,
                        skipped: 0,
                        duration: 0,
                        resultType: result.resultType
                    ]
                }

                // Accumulate results
                classResults[className].passed += result.successfulTestCount
                classResults[className].failed += result.failedTestCount
                classResults[className].skipped += result.skippedTestCount
                classResults[className].duration += (result.endTime - result.startTime)

                // Update result type (FAILURE takes precedence)
                if (result.resultType == TestResult.ResultType.FAILURE) {
                    classResults[className].resultType = TestResult.ResultType.FAILURE
                }
            }
        }
    }

    if (testTask.name.startsWith("functionalTest")) {
        testClassesDirs = sourceSets.functionalTest.output.classesDirs
        classpath = sourceSets.functionalTest.runtimeClasspath
        include "**/*FunctionalSpec*"
        finalizedBy jacocoTestReport, jacocoTestCoverageVerification // Generate JaCoCo report after tests
    }
}

// JaCoCo Configuration
jacoco {
    toolVersion = "0.8.14"
}

jacocoTestReport {

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/config/**',
                    '**/entity/**',
                    '**/repository/**',
                    '**/dto/**',
                    '**/SkroutzWebScraperApplication.class',
                    '**/Abstract*',
                    '**/HtmlFields.class',
                    '**/utis/**',
                    '**/*MapperImpl*',
                    '**/ScraperController.class',
                    '**/controllerAdvice/**'
            ])
        }))
    }

    executionData fileTree(buildDir).include("jacoco/*.exec")

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/config/**',
                    '**/entity/**',
                    '**/repository/**',
                    '**/dto/**',
                    '**/SkroutzWebScraperApplication.class',
                    '**/Abstract*',
                    '**/HtmlFields.class',
                    '**/utils/**',
                    '**/*MapperImpl*',
                    '**/ScraperController.class',
                    '**/controllerAdvice/**'
            ])
        }))
    }

    violationRules {
        rule {
            failOnViolation = true
            enabled = true
            element = 'CLASS'

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }

            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.7
            }

            limit {
                counter = 'METHOD'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }
        }
    }

    executionData fileTree(buildDir).include("jacoco/*.exec")
}

compileFunctionalTestGroovy {
    groovyClasspath = configurations.testCompileClasspath
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('functionalTest', Test) {
    include "**/*FunctionalSpec*"
}

test {
    exclude "**/*FunctionalSpec*"
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

dockerCompose.isRequiredBy(functionalTest)
