version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: skroutz_scraper
      POSTGRES_USER: skroutz_user
      POSTGRES_PASSWORD: skroutz_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  selenium:
    image: selenium/standalone-chrome:latest
    container_name: selenium-chrome
    ports:
      - "4444:4444"
      - "7900:7900"  # VNC port for viewing browser sessions
    shm_size: 2gb
    restart: unless-stopped

volumes:
  postgres_data: