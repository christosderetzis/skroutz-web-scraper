name: CI - Skroutz Scraper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 25
      uses: actions/setup-java@v2
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Application
      run: ./gradlew build -x test

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 25
      uses: actions/setup-java@v2
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Cache Docker images
      id: cache-docker
      uses: actions/cache@v4
      with:
        path: /tmp/docker-images
        key: docker-images-${{ hashFiles('docker-compose-functional-tests.yml') }}

    - name: Load cached Docker images
      if: steps.cache-docker.outputs.cache-hit == 'true'
      run: |
        docker load -i /tmp/docker-images/postgres.tar
        docker load -i /tmp/docker-images/elasticsearch.tar
        docker load -i /tmp/docker-images/nginx.tar
        docker load -i /tmp/docker-images/wiremock.tar

    - name: Pull and save Docker images
      if: steps.cache-docker.outputs.cache-hit != 'true'
      run: |
        mkdir -p /tmp/docker-images
        docker pull postgres:15
        docker pull docker.elastic.co/elasticsearch/elasticsearch:9.3.0
        docker pull nginx:alpine
        docker pull wiremock/wiremock:latest
        docker save postgres:15 -o /tmp/docker-images/postgres.tar
        docker save docker.elastic.co/elasticsearch/elasticsearch:9.3.0 -o /tmp/docker-images/elasticsearch.tar
        docker save nginx:alpine -o /tmp/docker-images/nginx.tar
        docker save wiremock/wiremock:latest -o /tmp/docker-images/wiremock.tar

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Run Tests
      run: ./gradlew test

    - name: Run Functional Tests
      run: ./gradlew functionalTest

    - name: Upload test reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: scraper-test-reports
        path: | 
          ./build/reports/tests/test
          ./build/reports/tests/functionalTest
        retention-days: 5

    - name: Upload code coverage on codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./build/reports/jacoco/test/jacocoTestReport.xml
        flags: unittests
        name: codecov-coverage-report
        fail_ci_if_error: false

