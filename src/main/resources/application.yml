
spring:
  application:
    name: skroutz-web-scraper
  
  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skroutz_scraper}
    username: ${DB_USERNAME:skroutz_user}
    password: ${DB_PASSWORD:skroutz_password}
    driver-class-name: org.postgresql.Driver
  
  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # Flyway Configuration
  flyway:
    schemas: scraper_schema

  # Elasticsearch Configuration
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}

# Scraper Configuration
scraper:
  base-url: https://www.skroutz.gr
  timeout-millis: 5000
  retry-delay-ms: 1000
  max-retries: 3
  delays:
    review-page-ms: 100
    specifications-ms: 500
    reviews-ms: 2000
    price-history-ms: 1000
  specifications:
    batch-size: 30

#LLM Configuration
ai:
  openai:
    base-url: ${LLM_BASE_URL:http://localhost:11434/v1}
    model: ${LLM_MODEL:qwen2.5:3b}
    max-tokens: 16000
    log-responses: ${LLM_LOG_RESPONSES:false}
  summarization:
    chunk-size: 10000

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
server:
  port: 8082