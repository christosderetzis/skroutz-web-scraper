
spring:
  application:
    name: skroutz-web-scraper

  # Security / OAuth2 Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/skroutz-scraper}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/skroutz-scraper/protocol/openid-connect/certs}

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skroutz_scraper}
    username: ${DB_USERNAME:skroutz_user}
    password: ${DB_PASSWORD:skroutz_password}
    driver-class-name: org.postgresql.Driver
  
  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # Flyway Configuration
  flyway:
    schemas: scraper_schema

  # Elasticsearch Configuration
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}

  lifecycle:
    timeout-per-shutdown-phase: 30s

# Scraper Configuration
scraper:
  base-url: https://www.skroutz.gr
  timeout-millis: 5000
  retry-delay-ms: 1000
  max-retries: 3
  delays:
    review-page-ms: 100
    specifications-ms: 150
    reviews-ms: 100
    price-history-ms: 50
  specifications:
    batch-size: 30
  job:
    stale-threshold-hours: 2

#LLM Configuration
ai:
  openai:
    base-url: ${LLM_BASE_URL:http://localhost:11434/v1}
    model: ${LLM_MODEL:qwen2.5:1.5b}
    max-tokens: 16000
    log-responses: ${LLM_LOG_RESPONSES:false}
  summarization:
    chunk-size: 10000

jwt:
  auth:
    converter:
      resource-id: skroutz-scraper-client
      principle-attribute: preferred_username

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
server:
  port: 8082
  shutdown: graceful