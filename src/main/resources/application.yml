
spring:
  application:
    name: skroutz-web-scraper
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/skroutz_scraper
    username: skroutz_user
    password: skroutz_password
    driver-class-name: org.postgresql.Driver
  
  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # Flyway Configuration
  flyway:
    schemas: scraper_schema

  # Elasticsearch Configuration
  elasticsearch:
    uris: http://localhost:${ELASTICSEARCH_PORT:9200}

# Scraper Configuration
scraper:
  base-url: https://www.skroutz.gr
  timeout-seconds: 30
  max-retries: 3
  delays:
    review-page-ms: 100
    specifications-ms: 500
    reviews-ms: 2000
    price-history-ms: 1000
  specifications:
    batch-size: 30

#LLM Configuration
ai:
  openai:
    base-url: http://172.25.80.1:1234/v1
    model: qwen/qwen3-vl-4b
    max-tokens: 16000
  summarization:
    chunk-size: 12000

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
server:
  port: 8082