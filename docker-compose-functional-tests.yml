version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: skroutz_scraper
      POSTGRES_USER: skroutz_user
      POSTGRES_PASSWORD: skroutz_password
    networks:
      - test-network
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skroutz_user -d skroutz_scraper"]
      interval: 10s
      timeout: 5s
      retries: 5

  mockserver:
    image: nginx:alpine
    container_name: mockserver
    volumes:
      - ./src/functionalTest/resources/mock-html:/usr/share/nginx/html:ro
    networks:
      - test-network
    ports:
      - "8080:80"  # Changed to avoid port 80 conflicts
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "80" ]
      interval: 10s
      timeout: 5s
      retries: 3

  chrome:
    image: selenium/standalone-chrome:latest
    container_name: chrome
    environment:
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    shm_size: 2gb
    networks:
      - test-network
    ports:
      - "4444:4444"
      - "7900:7900"  # VNC port for debugging (optional)
    depends_on:
      mockserver:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4444/wd/hub/status" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  test-network:
    driver: bridge
